<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<nav class="navbar">

    <div class="logo">
        Incoming Request Processing System
    </div>

    <div class="nav-links">
        <a href="index.html">Process Request</a>
        <a href="dashboard.html" class="active">Dashboard</a>
    </div>

</nav>

<div class="container">

    <h1>Dashboard</h1>

    <div class="dashboard-buttons">

        <button
            onclick="loadDashboard('complaint')"
        >
            Complaint
        </button>

        <button
            onclick="loadDashboard('enquiry')"
        >
            General Enquiry
        </button>

        <button
            onclick="loadDashboard('service')"
        >
            Service Request
        </button>

        <button
            onclick="loadDashboard('escalation')"
        >
            Escalation
        </button>

    </div>

    <div id="loader" class="loader hidden">
        Loading dashboard...
    </div>

    <div
        id="dashboardContent"
        class="hidden"
    >

        <div
            id="summaryCards"
            class="summary-grid"
        >
        </div>

        <div class="chart-card">

            <h2>Distribution</h2>

            <canvas id="dashboardChart"></canvas>

        </div>

        <div class="table-card">

            <h2>Recent Requests</h2>

            <table id="requestTable">

                <thead>

                <tr>

                    <th>ID</th>

                    <th>Request</th>

                    <th>Status</th>

                    <th>Assigned Team</th>

                    <th>Created At</th>

                </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

    </div>

</div>

<script src="../js/api.js"></script>
<script src="../js/dashboard.js"></script>

</body>
</html>
